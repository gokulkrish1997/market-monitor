name: market scan

on:
  schedule:
    # NSE hours are 09:15-15:30 IST = 03:45-10:00 UTC. Every 15 min, weekdays.
    - cron: "*/15 3-10 * * 1-5"
    # Crypto runs round the clock, but hourly outside market hours to save minutes.
    - cron: "0 * * * *"
  workflow_dispatch:          # gives you a "Run workflow" button for testing
    inputs:
      selftest:
        description: "Send a Telegram test message first"
        type: boolean
        default: false

concurrency:
  group: market-scan          # never let two runs push the journal at once
  cancel-in-progress: false

permissions:
  contents: write             # required to commit the journal back

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip          # this is what keeps each run under a minute

      - run: pip install -r requirements.txt

      - name: Selftest (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.selftest
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan.py --selftest

      - name: Scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan.py

      - name: Commit journal
        run: |
          git config user.name  "market-monitor"
          git config user.email "actions@github.com"
          git add journal/
          if git diff --staged --quiet; then
            echo "No journal changes."
            exit 0
          fi
          git commit -m "journal: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push retry $i"; sleep 5
          done
          exit 1
