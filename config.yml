capital: 100000          # notional paper capital, INR
risk_pct: 1.0            # % of capital risked per trade
atr_period: 14
atr_stop_mult: 2.0       # stop = entry - (mult x ATR)
target_r: 2.0            # target = entry + (target_r x risk)
timeout_bars: 20         # abandon the trade if neither level is hit
interval: 15m
lookback_bars: 120

# GitHub drops scheduled runs, sometimes for hours. These control catch-up.
catchup_bars: 30         # max candles to back-check after a missed run
max_alert_age_bars: 4    # only ping Telegram for signals newer than this;
                         # older ones are still logged to the journal
heartbeat_after_ist: "15:30"   # daily "still alive" ping, first run after this

# Tried in order; the first exchange that answers is used.
# Binance is last because it returns HTTP 451 to US datacentre IPs,
# which is where GitHub Actions runners live.
crypto_exchanges:
  - kraken
  - coinbase
  - bitstamp
  - gemini
  - binanceus
  - binance

# Round-trip costs as % of notional. Deducted from every result.
costs_pct:
  equity: 0.12
  crypto: 0.20

market_hours_ist:
  equity_open: "09:15"
  equity_close: "15:30"

rules:
  - rsi_reversal
